<line x1="44" y1="340" x2="1196" y2="340" stroke="#E5EAF0" stroke-width="1"/>

<text class="b" x="64" y="191">attn_q / attn_k / attn_o、ffn_gate / ffn_up 等 2D 权重</text>
<rect x="772" y="180" width="56" height="22" rx="11" fill="#D4EBE4" stroke="#63B0A0" stroke-width="1.1"/>
<text class="badge" x="800" y="195" text-anchor="middle" fill="#1C6A5A">Q4_K</text>
<text class="s" x="1010" y="191">256 权重 → 144 B</text>

<text class="b" x="64" y="235">token_embd（兼任输出层）</text>
<rect x="772" y="224" width="56" height="22" rx="11" fill="#FBE3D2" stroke="#E08A4C" stroke-width="1.1"/>
<text class="badge" x="800" y="239" text-anchor="middle" fill="#9A4E14">Q6_K</text>
<text class="s" x="1010" y="235">256 权重 → 210 B</text>

<text class="b" x="64" y="279">部分层的 attn_v、ffn_down（判据见下）</text>
<rect x="772" y="268" width="56" height="22" rx="11" fill="#FBE3D2" stroke="#E08A4C" stroke-width="1.1"/>
<text class="badge" x="800" y="283" text-anchor="middle" fill="#9A4E14">Q6_K</text>
<text class="s" x="1010" y="279">256 权重 → 210 B</text>

<text class="b" x="64" y="323">1D 归一化系数（RMSNorm）</text>
<rect x="776" y="312" width="48" height="22" rx="11" fill="#E8EDF2" stroke="#AEBAC7" stroke-width="1.1"/>
<text class="badge" x="800" y="327" text-anchor="middle" fill="#4E5C6B">F32</text>
<text class="s" x="1010" y="323">每数 4 B</text>

<!-- Section B -->
<text class="bi" x="44" y="376">第 i 层升级判据（n = 28）</text>
<text class="b" x="44" y="400">i &lt; n/8　或　i ≥ 7n/8　或　(i − n/8) mod 3 = 2　（整除）　→　命中 14 层</text>

