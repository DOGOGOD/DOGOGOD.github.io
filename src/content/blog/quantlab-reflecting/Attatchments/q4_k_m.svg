<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="676" viewBox="0 0 1240 676" role="img" aria-labelledby="qmt qmd">
<title id="qmt">Q4_K_M 的位分配规则与混合结果</title>
<desc id="qmd">在 Q4_K 底座上，token_embd 与部分层的 attn_v、ffn_down 升为 Q6_K，其余二维权重用 Q4_K，一维归一化系数保留 F32；28 层中命中 14 层升级。</desc>
<defs><style>
 text{font-family:"Helvetica Neue",Helvetica,Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1F2933}
 .t{font-size:21px;font-weight:700}
 .st{font-size:13px;fill:#5B6B7B}
 .b{font-size:12.5px}
 .bi{font-size:12.5px;font-weight:700}
 .s{font-size:11.5px;fill:#5B6B7B}
 .sh{font-size:11.5px;font-weight:700;fill:#5B6B7B}
 .c{font-size:10.5px;fill:#8B98A5}
 .badge{font-size:11.5px;font-weight:700}
</style></defs>
<rect width="1240" height="676" fill="#ffffff"/>
<text class="t" x="44" y="46">Q4_K_M：位分配规则与混合结果</text>
<text class="st" x="44" y="70">在 Q4_K 底座上，把额外精度集中投给最敏感的张量 —— token_embd / ffn_down / attn_v</text>
<line x1="44" y1="84" x2="1196" y2="84" stroke="#E5EAF0" stroke-width="1.5"/>

<!-- Section A -->
<text class="bi" x="44" y="120">张量类别 → 量化格式</text>
<rect x="44" y="134" width="1152" height="30" rx="4" fill="#E9EEF3"/>
<text class="sh" x="64" y="154">张量类别</text>
<text class="sh" x="800" y="154" text-anchor="middle">格式</text>
<text class="sh" x="1010" y="154">块级存储</text>

<rect x="44" y="164" width="1152" height="44" fill="#FFFFFF"/>
<rect x="44" y="208" width="1152" height="44" fill="#F7F9FB"/>
