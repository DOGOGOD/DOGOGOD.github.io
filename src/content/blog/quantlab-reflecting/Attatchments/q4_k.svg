<rect x="44" y="424" width="1152" height="46" rx="8" fill="#F4F7FA" stroke="#E5EAF0" stroke-width="1"/>
<text class="eq" x="66" y="453">x̂ = (d·sc<tspan font-size="9.5" dy="3">j</tspan><tspan dy="-3">)·q − (d</tspan><tspan font-size="9.5" dy="3">min</tspan><tspan dy="-3">·m</tspan><tspan font-size="9.5" dy="3">j</tspan><tspan dy="-3">)</tspan></text>
<text class="b" x="1174" y="453" text-anchor="end">位宽 = 1152 bit = 144 B → 4.5 bit/权重</text>

<text class="c" x="44" y="500">偏移自超块首字节计；其中 sc、m 为 6 位无符号整数。</text>
